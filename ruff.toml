# Project-wide ruff config: deterministic linting regardless of user-level
# ~/.config/ruff settings (ruff falls back to those when no project config
# exists, which makes local runs diverge from CI).
line-length = 100
target-version = "py312"

[lint]
select = [
    "E",   # pycodestyle errors, incl. E501 hard 100-column cap
    "W",   # pycodestyle warnings
    "F",   # pyflakes: unused imports/vars, undefined names
    "B",   # flake8-bugbear: bug-prone constructs
    "I",   # import sorting
    "UP",  # pyupgrade: modern syntax
    "RUF", # ruff-native rules
    "EXE", # shebang/executable-bit hygiene
    "PL",  # pylint-derived correctness checks
    "A",   # builtin shadowing
    "ARG", # unused function arguments
    "C4",  # comprehension simplification
    "DTZ", # naive datetime construction
    "FURB",# refurb modernization checks
    "PTH", # os.path -> pathlib
    "PERF",# performance lints
    "RET", # return simplification
    "RSE", # unnecessary parens on raise
    "SIM", # flake8-simplify: control flow and comprehension clarity
    "S",   # flake8-bandit: suspicious constructs
    "N",   # pep8-naming: signatures, cases, and error-class names
    "PIE", # flake8-pie: misc correctness and simplification traps
    "TID", # banned relative imports, so a module always names its real import path
    "FA",  # future-annotations consistency with the pinned target version
    "ERA", # commented-out code, which hides unmerged work behind a passing gate
    "TD",  # TODO/FIXME must name an owner or a tracking issue
    "ISC", # implicit string concat: adjacent literals in a collection read as one
           # element, and `+` concat defeats the formatter
    "PGH", # pygrep-hooks: a bare `# noqa` or `# type: ignore` with no rule or error
           # code silences the whole line, hiding more than it names
]
