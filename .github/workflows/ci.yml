name: ci
on: [push, pull_request]

# Workflows get a read-only token by default; nothing here needs write access.
permissions:
  contents: read

# Push and pull_request both fire for PR branches; cancel superseded runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server-guard:
    # Pinned image instead of ubuntu-latest: the ambient toolchain (make, git,
    # tar) must not drift under a moving tag.
    runs-on: ubuntu-24.04
    steps:
      # actions/checkout v4.2.2. SHA-pinned per dependabot.yml: these actions
      # are the whole dependency surface, so tags must not be mutable refs.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # astral-sh/setup-uv v5: uv installs the interpreter minor declared in
      # .python-version and the locked dependency set, instead of whatever the
      # runner image happens to ship.
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true
      # Same bootstrap path as a fresh local clone; CI carries no second,
      # diverging install recipe.
      - run: make setup
      - run: make ci
