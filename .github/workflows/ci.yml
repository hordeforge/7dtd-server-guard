name: ci
on: [push, pull_request]

# Workflows get a read-only token by default; nothing here needs write access.
permissions:
  contents: read

# Push and pull_request both fire for PR branches; cancel superseded runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server-guard:
    # Pinned image instead of ubuntu-latest: the ambient toolchain (make, git,
    # tar) must not drift under a moving tag.
    runs-on: ubuntu-24.04
    # A wedged fuzzer must fail the job, not hold a runner for the 6h default.
    timeout-minutes: 20
    env:
      # Gate output and generated files must not depend on the runner's locale,
      # zone, or hash seed: sort order and any time formatting are then the
      # same here and on a developer machine.
      LC_ALL: C.UTF-8
      TZ: UTC
      PYTHONHASHSEED: "0"
    steps:
      # actions/checkout, SHA-pinned per dependabot.yml: these actions are the
      # whole dependency surface, so tags must not be mutable refs. The
      # trailing version comment on each `uses` line is the source of truth.
      # The token is read-only and nothing pushes from CI, so the credential
      # does not stay in .git/config between steps.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # astral-sh/setup-uv: uv installs the interpreter version declared in
      # .python-version and the locked dependency set, instead of whatever the
      # runner image happens to ship. The action SHA alone is not the pin: the
      # uv release it fetches is named here, so the resolver that reads
      # uv.lock cannot change under a green run.
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.13"
          enable-cache: true
      # Same bootstrap path as a fresh local clone; CI carries no second,
      # diverging install recipe.
      - run: make setup
      - run: make ci
