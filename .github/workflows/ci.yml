name: ci
on: [push, pull_request]

# Workflows get a read-only token by default; nothing here needs write access.
permissions:
  contents: read

# Push and pull_request both fire for PR branches; cancel superseded runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server-guard:
    # Pinned image instead of ubuntu-latest: the ambient toolchain (make, git,
    # tar) must not drift under a moving tag.
    runs-on: ubuntu-24.04
    steps:
      # actions/checkout v4.2.2. SHA-pinned per dependabot.yml: these actions
      # are the whole dependency surface, so tags must not be mutable refs.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # actions/setup-python v5: install the exact interpreter minor declared in
      # .python-version instead of whatever the runner image happens to ship.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      # Same bootstrap path as a fresh local clone; CI carries no second,
      # diverging install recipe.
      - run: make setup
      - run: make ci
