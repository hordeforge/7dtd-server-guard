    family: world
    phase: 8
    ceiling: Hard
    default_mode: observe
    hard_condition: "Hard only for the authorization subset (claims, locks, ownership, allowlist, overflow); positional and cadence subchecks consume client-declared position and stay Strong"
    summary: "Block changes respect reach, tool, material, claim, cadence, and world bounds."
    inputs:
      - {name: requested_position, authority: client-declared, role: observed, note: "subject of reach/bounds subchecks"}
      - {name: claim_lock_state, authority: server-derived, role: decision}
      - {name: block_definitions, authority: server-derived, role: decision}
      - {name: tool_material, authority: server-derived, role: decision}
      - {name: world_bounds, authority: server-derived, role: decision}
    algorithm: |
      Authorization subchecks (claim, lock, ownership, entity-class allowlist, negative/
      overflow damage) are Hard with complete server inputs. Reach, tool/material
      suitability, and cadence subchecks bound client claims and stay Strong. Reject seams
      document co-patching behavior.
    state: "Per-player block-action budget."
    thresholds:
      - {key: max_block_actions_per_minute, type: int, range: [1, 100000], default: 3000, note: "placeholder"}
      - {key: reach_tolerance_m, type: float, range: [0.0, 5.0], default: 0.5, unit: m}
