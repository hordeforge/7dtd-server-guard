      - {name: idempotency_cache, authority: server-derived, role: decision}
    algorithm: |
      Session-scoped idempotency cache: a replayed transaction is a no-op (the second
      application is rejected without state change). The verdict depends only on the
      server's cache.
    state: "Per-session bounded transaction-id cache with replay-window expiry."
    thresholds:
