[project]
name = "7dtd-server-guard-tools"
version = "0.4.1"
description = "Docs gate, detector renderer, evidence verifier, and fuzzers for 7dtd-server-guard"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "AGPL-3.0-only" }
dependencies = [
  "PyYAML>=6,<7",
]

[dependency-groups]
dev = [
  "black==26.5.1",
  "ruff==0.16.8",
  "mypy==2.3.1",
  "types-PyYAML==6.0.12.20250915",
]

# Lint and typecheck settings live in ruff.toml and mypy.ini: those filenames
# outrank [tool.*] sections here (first config found wins, no merging), so
# keeping them out of this file avoids two drifting copies of each setting.

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.uv]
package = false
# Machine-readable pin for the resolver itself, the same release CI installs via
# astral-sh/setup-uv (0.12.13). uv refuses to run against a mismatch with the
# required release named, so a contributor on a different uv learns that before a
# lockfile is resolved or a gate result is produced, instead of resolving the lock
# differently from the recorded build.
required-version = "==0.12.13"
